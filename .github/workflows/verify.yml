name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate workflow state
        run: python scripts/check_paper_state.py --state .omc/paper-state.md
      - name: Validate source registry structure
        run: python scripts/verify_source_registry.py --registry docs/notes/retrieved-sources.json
      - name: Verify citations
        run: python scripts/verify_citations.py --registry docs/notes/retrieved-sources.json --sections docs/sections/*.md
